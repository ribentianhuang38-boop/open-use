[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-use"
version = "0.1.0"
description = "Dual-core autonomous agent bridging browser and native desktop automation with sub-50ms decisions and MCP support."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "Wyatt Liao" }
]
keywords = [
    "agent",
    "mcp",
    "mcp-server",
    "open-use",
    "browser-use",
    "computer-use",
    "automation",
    "rpa",
    "typesafe-jev",
    "macos",
    "windows",
    "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.25.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "numpy>=1.24.0,<3.0.0",
    "websockets>=11.0.0,<14.0.0",
]

[project.optional-dependencies]
windows = [
    "rapidocr-onnxruntime>=1.3.0",
    "onnxruntime>=1.16.0",
    "mss>=9.0.0",
    "opencv-python-headless>=4.8.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.scripts]
open-use = "open_use.cli:main"
openuse = "open_use.cli:main"
# Aliases for backwards compatibility
omni-use = "open_use.cli:main"
omni = "open_use.cli:main"

[tool.setuptools.packages.find]
include = ["open_use*"]

[tool.setuptools.package-data]
open_use = [
    "bin/*",
    "desktop/swift/*",
]
