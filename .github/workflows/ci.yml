name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Lint and Syntax check
      run: |
        python -m py_compile run.py
        python -m py_compile open_use/*.py
        python -m py_compile open_use/core/*.py
        python -m py_compile open_use/desktop/*.py
        python -m py_compile open_use/browser/*.py

    - name: Verify CLI Help
      run: |
        python run.py --help

    - name: Run Unit Tests
      run: |
        pytest tests/ -v
